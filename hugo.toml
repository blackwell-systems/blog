baseURL = 'https://blog.blackwell-systems.com/'
languageCode = 'en-us'
title = 'Blackwell Systems'
theme = 'PaperMod'
enableRobotsTXT = true
enableInlineShortcodes = true

[pagination]
  pagerSize = 20

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[outputs]
  home = ["HTML", "RSS", "JSON"]   # JSON enables PaperMod search

[markup]
  [markup.highlight]
    noClasses = false
    style = 'monokai'
    lineNos = true
  [markup.goldmark.renderer]
    unsafe = true
  # Pass LaTeX math through untouched so KaTeX can render it client-side.
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['\[', '\]']]
      inline = [['\(', '\)']]

[params]
  description = 'Building the agentic stack and publishing the proof: systems, open source, and evidence-first engineering by Dayna Blackwell.'
  keywords = ['gcf', 'agent-lsp', 'mcp', 'claude code', 'agentic stack', 'developer tools', 'go', 'evidence-first', 'open source', 'systems architecture']
  defaultTheme = 'dark'
  disableThemeToggle = true
  ShowReadingTime = false
  ShowShareButtons = false
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowRelated = true
  mainSections = ['posts']
  footerHtml = '© 2026 Blackwell Systems'

  [params.author]
    name = 'Blackwell Systems'

  [params.homeInfoParams]
    Title = 'Blackwell Systems'
    Content = 'Technical writing on developer tools, automation, and systems programming.'

[sitemap]
  changefreq = 'weekly'
  priority = 0.5

[[menu.main]]
  identifier = "posts"
  name = "POSTS"
  weight = 1
  url = "/posts/"
