baseURL = 'https://blog.blackwell-systems.com/'
languageCode = 'en-us'
title = 'Blackwell Systems'
theme = 'nightfall'
enableRobotsTXT = true

[pagination]
  pagerSize = 20

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[params]
  description = 'Technical writing on developer tools, automation, and systems programming'
  github = 'blackwell-systems'
  keywords = ['blackdot', 'dotfiles', 'claude code', 'developer tools', 'secret management', 'go', 'shell scripting', 'automation']
  showTags = false  # Hide tags on individual post pages
  showReadingTime = false  # Hide reading time on post pages
  showRelated = true
  footerHtml = '© 2026 Blackwell Systems'

[params.author]
  name = 'Blackwell Systems'

[sitemap]
  changefreq = 'weekly'
  priority = 0.5

[menu]
  [[menu.header]]
    name = "POSTS"
    weight = 1
    url = "/posts"
  [[menu.header]]
    name = "PRODUCTS"
    weight = 2
    url = "/products"
  [[menu.header]]
    name = "OPEN SOURCE SOFTWARE"
    weight = 3
    url = "/oss"
  [[menu.header]]
    name = "CONSULTING"
    weight = 4
    url = "/consulting"
  [[menu.header]]
    name = "ABOUT"
    weight = 5
    url = "/about"

[markup]
  [markup.highlight]
    style = 'monokai'
    lineNos = true
  [markup.goldmark.renderer]
    unsafe = true
  # Pass LaTeX math through untouched so KaTeX can render it client-side.
  # Only \( \) and \[ \] are delimiters; $ and $$ are deliberately NOT, to avoid
  # colliding with dollar amounts in prose and with $-quoted shell/JSON in code.
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['\[', '\]']]
      inline = [['\(', '\)']]
